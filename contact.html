<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Demand Footwear</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="page-hero"><div class="container"><h1>Contact Us</h1><p>We'd love to hear from you.</p></div></div>
  <div class="container section-tight">
    <div class="cart-layout">
      <div class="card-surface">
        <h3>Send a Message</h3>
        <form id="contactForm">
          <div class="form-row">
            <div class="form-group"><label for="cName">Full Name *</label><input class="form-control" id="cName" required></div>
            <div class="form-group"><label for="cEmail">Email *</label><input class="form-control" type="email" id="cEmail" required></div>
          </div>
          <div class="form-group"><label for="cSubject">Subject</label><input class="form-control" id="cSubject"></div>
          <div class="form-group"><label for="cMessage">Message *</label><textarea class="form-control" id="cMessage" rows="5" required></textarea></div>
          <button class="btn btn-primary" type="submit">Send Message</button>
          <p class="hint" style="margin-top:10px;">Demo form — messages are not actually transmitted.</p>
        </form>
      </div>
      <div class="card-surface">
        <h3>Get in Touch</h3>
        <p><i class="bi bi-geo-alt"></i>&nbsp; House 12, Road 5, Dhaka, Bangladesh</p>
        <p><i class="bi bi-envelope"></i>&nbsp; hello@demandfootwear.example</p>
        <p><i class="bi bi-telephone"></i>&nbsp; +880 1700-000000</p>
        <p><i class="bi bi-clock"></i>&nbsp; Sat–Thu, 10am–8pm</p>
        <div class="social-row" style="margin-top:16px;">
          <a href="#" style="border-color:var(--df-border);color:var(--df-text);" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#" style="border-color:var(--df-border);color:var(--df-text);" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" style="border-color:var(--df-border);color:var(--df-text);" aria-label="X (Twitter)"><i class="bi bi-twitter-x"></i></a>
        </div>
      </div>
    </div>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/cart.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", (e) => { e.preventDefault(); showToast("Message sent! (Demo only — not actually transmitted.)", "success"); e.target.reset(); });
</script>
</body>
</html>
