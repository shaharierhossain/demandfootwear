<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Demand Footwear</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn admin-mobile-toggle" id="mobileSidebarToggle" aria-label="Toggle menu"><i class="bi bi-list"></i></button>
        <h1 id="adminSectionTitle">Dashboard</h1>
      </div>
      <span class="muted" id="adminClock" style="font-size:.85rem;"></span>
    </div>
    <div id="adminMain"><div class="skeleton" style="height:300px;"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script src="js/inventory.js"></script>
<script src="js/admin.js"></script>
<script>
  document.getElementById("adminClock").textContent = new Date().toLocaleString();
  setInterval(() => { document.getElementById("adminClock").textContent = new Date().toLocaleString(); }, 30000);
</script>
</body>
</html>
