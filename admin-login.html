<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Demand Footwear</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand"><span class="mark">DF</span> Demand Footwear</div>
    <h2 class="text-center" style="font-size:1.3rem;">Administrator Sign In</h2>
    <p class="muted text-center" style="font-size:.86rem;margin-bottom:20px;">Restricted access — store staff only.</p>
    <form id="adminLoginForm">
      <div class="form-group"><label for="adminUser" id="adminUserLabel">Username</label><input class="form-control" id="adminUser" required autocomplete="username"></div>
      <div class="form-group"><label for="adminPass">Password</label><input class="form-control" type="password" id="adminPass" required autocomplete="current-password"></div>
      <p class="field-error" id="loginError">Invalid administrator credentials.</p>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <div class="demo-creds" id="demoCredsBox">
      <strong>Demo credentials</strong><br>
      Username: <code>admin</code> &middot; Password: <code>demand2026</code><br>
      <span class="muted">This is a front-end-only demo gate — see README for real authentication requirements.</span>
    </div>
    <p class="text-center" style="margin-top:16px;"><a href="index.html" class="muted" style="font-size:.85rem;">← Back to storefront</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
if (window.DF.isLiveMode) {
  document.getElementById("adminUserLabel").textContent = "Admin Email";
  document.getElementById("adminUser").type = "email";
  document.getElementById("adminUser").placeholder = "owner@yourstore.com";
  document.getElementById("demoCredsBox").style.display = "none";
}
document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("adminUser").value.trim();
  const password = document.getElementById("adminPass").value;
  const errorEl = document.getElementById("loginError");
  errorEl.classList.remove("show");
  try {
    await window.DF.api.loginAdmin(username, password);
    window.location.href = "admin.html";
  } catch (err) {
    errorEl.textContent = err.message || "Invalid administrator credentials.";
    errorEl.classList.add("show");
  }
});
</script>
</body>
</html>
